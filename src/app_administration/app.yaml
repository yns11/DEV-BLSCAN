# =============================================================================
# App « Administration des BL » — variante SCAN COPIEUR.
# Toute la configuration est ici (ni bundle, ni secret scope).
#
# NON déclaré ici, car injecté automatiquement par Databricks Apps :
#   * PGHOST / PGPORT / PGDATABASE / PGUSER / PGSSLMODE -> ressource Database
#     (Lakebase), à ajouter dans Edit ▸ Resources avec la clé « postgres » ;
#   * l'identité SSO de l'utilisateur (en-têtes HTTP).
#
# Le SEUL secret de la solution (client secret Entra ID) n'est PAS ici : il
# vit dans un secret scope Databricks et n'est lu que par les jobs.
# =============================================================================
command: ["streamlit", "run", "app.py", "--server.headless=true"]
env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"

  # --- Environnement et sécurité ---------------------------------------------
  - name: BL_ENVIRONMENT
    value: "pre-prod"
  - name: BL_RBAC_MODE
    value: "strict"
  # Administrateurs de secours : indispensable au premier démarrage pour
  # pouvoir ouvrir Gestion ▸ Rôles et attribuer les droits.
  - name: BL_BOOTSTRAP_ADMINS
    value: "younes.elhachi1@emotors.com"

  # --- Base de données --------------------------------------------------------
  # Schéma DISTINCT de la solution d'origine (bl_demat) : les deux cohabitent.
  - name: BL_PG_SCHEMA
    value: "bl_scan"
  - name: BL_TIMEZONE
    value: "Europe/Paris"
  - name: BL_PAGE_SIZE
    value: "50"

  # --- Extraction IA ----------------------------------------------------------
  # Endpoint de model serving (vision). Sert à l'écran de validation des scans
  # ET à l'analyse rédigée des rapports d'activité. Ajouter la ressource
  # « Serving endpoint » à l'app avec la permission « Can query ».
  # Vide = validation en saisie manuelle, rapports sans analyse.
  - name: BL_LLM_ENDPOINT
    value: "databricks-claude-opus-4-8"

  # --- Pipeline de scan -------------------------------------------------------
  # Un scan = UN bordereau, de 1 à 25 pages (5 en moyenne).
  - name: BL_SCAN_MAX_PAGES
    value: "25"
  # Scans pré-analysés en avance dans l'écran de validation.
  - name: BL_SCAN_PAGES_AVANCE
    value: "1"
  # Création automatique quand le code tiers est reconnu mais qu'AUCUN avis
  # d'expédition ne confirme le numéro. Laisser "false" jusqu'à avoir mesuré
  # la précision réelle du modèle sur votre parc (voir GUIDE §6).
  - name: BL_SCAN_AUTO_SANS_DESADV
    value: "false"
  # Fragments d'adresse qui déterminent le sens du scan (un alias par flux).
  - name: BL_SCAN_ALIAS_ACHAT
    value: "reception"
  - name: BL_SCAN_ALIAS_VENTE
    value: "expedition"
  # Durée du verrou de prise en charge d'un scan à valider (minutes).
  - name: BL_SCAN_VERROU_MINUTES
    value: "60"
  # Conservation du PDF source après traitement (jours). La trace et les
  # images du BL sont conservées indéfiniment.
  - name: BL_SCAN_RETENTION_PDF_JOURS
    value: "180"

  # --- Bornes des images produites depuis le PDF ------------------------------
  - name: BL_MAX_IMAGE_BYTES
    value: "4194304"
  - name: BL_MAX_DIMENSION_PX
    value: "3508"

  # --- Notification Teams -----------------------------------------------------
  # Nouvelle réception (créée automatiquement ou après validation).
  - name: BL_TEAMS_WEBHOOK_RECEPTION
    value: ""
  # Passage EDI NOK -> OK depuis la fiche BL.
  - name: BL_TEAMS_WEBHOOK_EDI
    value: ""
  - name: BL_TEAMS_TIMEOUT_S
    value: "8"
  # flow  (défaut) l'app envoie les e-mails + le marqueur {{MENTIONS}} ; le flux
  #       Power Automate croise ces e-mails avec les membres de l'équipe.
  # texte noms en clair, sans mention.
  - name: BL_TEAMS_MENTION_MODE
    value: "flow"
